name: VizhiTN Autonomous Civic Bot

on:
  schedule:
    # 02:00 UTC = 07:30 AM IST (Slot 1: Morning Utility & Power Cut Batch)
    - cron: '0 2 * * *'
    # 06:00 UTC = 11:30 AM IST (Slot 2: Midday Welfare Schemes & Jobs Batch)
    - cron: '0 6 * * *'
    # 08:30 UTC = 02:00 PM IST (Slot 3: Afternoon Interactive Community Poll)
    - cron: '30 8 * * *'
    # 13:00 UTC = 06:30 PM IST (Slot 4: Evening Advisory & Tomorrow Advance Batch)
    - cron: '0 13 * * *'

  workflow_dispatch:
    inputs:
      pulse:
        description: 'Editorial Pulse to execute'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - midday
          - poll
          - evening
          - weekend
          - dry-run

concurrency:
  group: autonomous-civic-bot
  cancel-in-progress: false

jobs:
  civic-dispatch:
    name: Generate & Publish Civic Batch
    # Pin to a stable LTS image. `ubuntu-latest` will roll over to Ubuntu 26.04
    # beginning Oct 19, 2026, which can cause runner-pool churn/provisioning stalls.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Autonomous Civic Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEW_GEMINI_API_KEY: ${{ secrets.NEW_GEMINI_API_KEY }}
          YOUTUBE_GEMINI_API_KEY: ${{ secrets.YOUTUBE_GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          NEXT_PUBLIC_VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vizhitn.in' }}
          WHATSAPP_SESSION: ${{ secrets.WHATSAPP_SESSION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL || '@cf/black-forest-labs/flux-1-schnell' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_INSTA_ACCOUNT_ID: ${{ secrets.META_INSTA_ACCOUNT_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          INPUT_PULSE="${{ github.event.inputs.pulse }}"
          if [ -n "$INPUT_PULSE" ] && [ "$INPUT_PULSE" != "auto" ]; then
            echo "Executing manually requested pulse: $INPUT_PULSE"
            node scripts/auto-civic-poster.mjs --pulse="$INPUT_PULSE"
          else
            echo "Executing auto-detected pulse based on IST schedule"
            node scripts/auto-civic-poster.mjs
          fi

      - name: Ping Search Engines via IndexNow
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vizhitn.in' }}
        run: npm run indexnow:all || true
