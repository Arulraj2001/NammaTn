name: VizhiTN Autonomous Civic Bot

on:
  schedule:
    # 02:00 UTC = 07:30 AM IST (Slot 1: Morning Civic Batch + WhatsApp Top 5 & Power Cut Card)
    - cron: '0 2 * * *'
    # 06:30 UTC = 12:00 PM IST (Slot 2: Midday Schemes Batch + WhatsApp Verified Job Radar Card)
    - cron: '30 6 * * *'
    # 09:30 UTC = 03:00 PM IST (Slot 3: Native 1-Tap WhatsApp Community / Exam Poll)
    - cron: '30 9 * * *'
    # 13:30 UTC = 07:00 PM IST (Slot 4: Evening Advisory + Tomorrow Advance Power Cut Card)
    - cron: '30 13 * * *'

  workflow_dispatch:
    inputs:
      pulse:
        description: 'Editorial Pulse to execute'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - midday
          - poll
          - evening
          - weekend
          - dry-run

concurrency:
  group: autonomous-civic-bot
  cancel-in-progress: false

jobs:
  civic-dispatch:
    name: Generate & Publish Civic Batch
    # Pin to a stable LTS image. `ubuntu-latest` will roll over to Ubuntu 26.04
    # beginning Oct 19, 2026, which can cause runner-pool churn/provisioning stalls.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Tamil Fonts for WhatsApp Infographics
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-ui-core fonts-taml fontconfig
          fc-cache -fv

      - name: Broadcast Dedicated Afternoon Poll to WhatsApp Channel
        if: github.event.schedule == '30 9 * * *' || github.event.inputs.pulse == 'poll'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEW_GEMINI_API_KEY: ${{ secrets.NEW_GEMINI_API_KEY }}
          NEW2_GEMINI_API_KEY: ${{ secrets.NEW2_GEMINI_API_KEY }}
          YOUTUBE_GEMINI_API_KEY: ${{ secrets.YOUTUBE_GEMINI_API_KEY }}
          WHATSAPP_SESSION: ${{ secrets.WHATSAPP_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          NEXT_PUBLIC_VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          YOUTUBE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.YOUTUBE_CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          CHROME_BIN: '/usr/bin/google-chrome'
        run: |
          echo "Broadcasting dedicated 3:00 PM Native Poll to WhatsApp Channel..."
          node scripts/whatsapp-channel-bot.mjs --slot=poll

      - name: Run Autonomous Civic Poster
        if: github.event.schedule != '30 9 * * *' && github.event.inputs.pulse != 'poll'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEW_GEMINI_API_KEY: ${{ secrets.NEW_GEMINI_API_KEY }}
          YOUTUBE_GEMINI_API_KEY: ${{ secrets.YOUTUBE_GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          NEXT_PUBLIC_VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vizhitn.in' }}
          WHATSAPP_SESSION: ${{ secrets.WHATSAPP_SESSION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.YOUTUBE_CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL || '@cf/black-forest-labs/flux-1-schnell' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_INSTA_ACCOUNT_ID: ${{ secrets.META_INSTA_ACCOUNT_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          INPUT_PULSE="${{ github.event.inputs.pulse }}"
          if [ -n "$INPUT_PULSE" ] && [ "$INPUT_PULSE" != "auto" ]; then
            echo "Executing manually requested pulse: $INPUT_PULSE"
            node scripts/auto-civic-poster.mjs --pulse="$INPUT_PULSE"
          else
            echo "Executing auto-detected pulse based on IST schedule"
            node scripts/auto-civic-poster.mjs
          fi

      - name: Broadcast Native Growth Slot to WhatsApp Channel
        if: always() && github.event.schedule != '30 9 * * *' && github.event.inputs.pulse != 'poll'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEW_GEMINI_API_KEY: ${{ secrets.NEW_GEMINI_API_KEY }}
          NEW2_GEMINI_API_KEY: ${{ secrets.NEW2_GEMINI_API_KEY }}
          YOUTUBE_GEMINI_API_KEY: ${{ secrets.YOUTUBE_GEMINI_API_KEY }}
          WHATSAPP_SESSION: ${{ secrets.WHATSAPP_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          NEXT_PUBLIC_VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          YOUTUBE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.YOUTUBE_CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          CHROME_BIN: '/usr/bin/google-chrome'
        run: |
          INPUT_PULSE="${{ github.event.inputs.pulse }}"
          if [ -n "$INPUT_PULSE" ] && [ "$INPUT_PULSE" != "auto" ]; then
            node scripts/whatsapp-channel-bot.mjs --slot="$INPUT_PULSE"
          else
            node scripts/whatsapp-channel-bot.mjs --slot=auto
          fi

      - name: Ping Search Engines via IndexNow
        if: success() && github.event.schedule != '30 9 * * *' && github.event.inputs.pulse != 'poll'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vizhitn.in' }}
        run: npm run indexnow:all || true
