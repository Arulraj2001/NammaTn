name: VizhiTN Autonomous YouTube Video Bot

on:
  schedule:
    # 1. Daily 07:30 PM IST (14:00 UTC): Daily Civic Shorts
    - cron: '0 14 * * *'
    # 2. Mon, Wed, Fri 07:00 AM IST (01:30 UTC): Weekly Thrice Long-Form Explainer
    - cron: '30 1 * * 1,3,5'

  workflow_dispatch:
    inputs:
      pipeline_type:
        description: 'Video Type to Generate'
        type: choice
        options:
          - shorts
          - long-form
          - both
        default: 'shorts'
      target_slug:
        description: 'Article Slug for Long-Form (optional, leaves empty for latest)'
        required: false
        default: ''
      dry_run:
        description: 'Dry Run Mode (true = render video only, no YouTube upload)'
        type: boolean
        default: false

concurrency:
  group: autonomous-youtube-bot
  cancel-in-progress: false

jobs:
  youtube-publish:
    name: Autonomous YouTube Video Production
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg & Tamil Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-taml fonts-noto-cjk

      - name: Install Node Dependencies
        run: npm ci

      - name: Execute YouTube Production Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          NEXT_PUBLIC_VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vizhitn.in' }}
          CHROME_BIN: '/usr/bin/google-chrome'
        run: |
          PIPELINE="${{ github.event.inputs.pipeline_type || 'auto' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          SLUG="${{ github.event.inputs.target_slug }}"

          EXTRA_FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi

          if [ "$PIPELINE" = "auto" ]; then
            # Determine based on current hour: 01:30 UTC is morning long-form; 14:00 UTC is evening shorts
            CURRENT_HOUR=$(date -u +%H)
            if [ "$CURRENT_HOUR" -lt "10" ]; then
              echo "[AUTO TRIGGER] Morning Window: Executing Weekly In-Depth Long-Form Explainer..."
              node scripts/youtube/pipelines/generate-long-video.mjs $EXTRA_FLAGS
            else
              echo "[AUTO TRIGGER] Evening Window: Executing Daily Civic Short..."
              node scripts/youtube/pipelines/generate-shorts.mjs $EXTRA_FLAGS
            fi
          elif [ "$PIPELINE" = "shorts" ]; then
            echo "[DISPATCH] Executing Daily Civic Short..."
            node scripts/youtube/pipelines/generate-shorts.mjs $EXTRA_FLAGS
          elif [ "$PIPELINE" = "long-form" ]; then
            echo "[DISPATCH] Executing Long-Form Explainer..."
            if [ -n "$SLUG" ]; then
              node scripts/youtube/pipelines/generate-long-video.mjs --slug=$SLUG $EXTRA_FLAGS
            else
              node scripts/youtube/pipelines/generate-long-video.mjs $EXTRA_FLAGS
            fi
          elif [ "$PIPELINE" = "both" ]; then
            echo "[DISPATCH] Executing Both Shorts and Long-Form Videos..."
            node scripts/youtube/pipelines/generate-shorts.mjs $EXTRA_FLAGS
            node scripts/youtube/pipelines/generate-long-video.mjs $EXTRA_FLAGS
          fi
