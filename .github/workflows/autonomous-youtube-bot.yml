name: VizhiTN Autonomous YouTube Video Bot

on:
  schedule:
    # 1. Daily 01:30 UTC = 07:00 AM IST (Statewide Civic Lifeline Alert: Power Cuts & School Holidays + WhatsApp Channel Sync)
    - cron: '30 1 * * *'
    # 2. Daily 08:00 UTC = 01:30 PM IST (TN Mega Projects & Real Scam Exposes + Auto-sync to FB & IG Reels)
    - cron: '0 8 * * *'
    # 3. Daily 13:30 UTC = 07:00 PM IST (Tamil Nadu Untold Mysteries & Engineering Marvels)
    - cron: '30 13 * * *'

  workflow_dispatch:
    inputs:
      pipeline_type:
        description: 'Dedicated Broadcast Slot to Execute'
        type: choice
        options:
          - auto
          - civic-alert
          - infotainment-afternoon
          - infotainment-evening
        default: 'auto'
      dry_run:
        description: 'Dry Run Mode (true = render video only, no YouTube upload)'
        type: boolean
        default: false

concurrency:
  group: autonomous-youtube-bot
  cancel-in-progress: false

jobs:
  youtube-publish:
    name: Autonomous YouTube Video Production
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg, Tamil Fonts & Python TTS)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core fonts-noto-hinted fonts-taml fontconfig python3 python3-pip
          fc-cache -fv
          pip3 install --quiet --upgrade "edge-tts>=7.3.1" --break-system-packages

      - name: Install Node Dependencies
        run: npm ci

      - name: Cache Render Workspace and Visual Assets
        uses: actions/cache@v4
        with:
          path: |
            public/youtube_renders
            /tmp/yt-render
          key: yt-render-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            yt-render-cache-${{ github.run_id }}-
            yt-render-cache-

      - name: Execute YouTube Production Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEW_GEMINI_API_KEY: ${{ secrets.NEW_GEMINI_API_KEY }}
          YOUTUBE_GEMINI_API_KEY: ${{ secrets.YOUTUBE_GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          NEXT_PUBLIC_VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.YOUTUBE_CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_CLOUDFLARE_API_TOKEN: ${{ secrets.YOUTUBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTA_ACCOUNT_ID: ${{ secrets.META_INSTA_ACCOUNT_ID }}
          WHATSAPP_SESSION: ${{ secrets.WHATSAPP_SESSION }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vizhitn.in' }}
          CHROME_BIN: '/usr/bin/google-chrome'
        run: |
          PIPELINE="${{ github.event.inputs.pipeline_type || 'auto' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          SCHEDULE="${{ github.event.schedule }}"

          EXTRA_FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi

          SLOT_ARG="--slot=$PIPELINE"
          if [ -z "$PIPELINE" ] || [ "$PIPELINE" = "auto" ]; then
            if [ "$SCHEDULE" = "30 1 * * *" ]; then
              SLOT_ARG="--slot=civic-alert"
            elif [ "$SCHEDULE" = "0 8 * * *" ]; then
              SLOT_ARG="--slot=infotainment-afternoon"
            elif [ "$SCHEDULE" = "30 13 * * *" ]; then
              SLOT_ARG="--slot=infotainment-evening"
            else
              SLOT_ARG="--slot=auto"
            fi
          fi

          echo "[DISPATCH] Executing VizhiTN Dedicated Broadcast Dispatcher ($SLOT_ARG $EXTRA_FLAGS)..."
          node scripts/youtube/dispatch-broadcast.mjs $SLOT_ARG $EXTRA_FLAGS
