name: VizhiTN Autonomous YouTube Video Bot

on:
  schedule:
    # 1. Mon, Wed, Fri 07:00 AM IST (01:30 UTC): Weekly Thrice In-Depth Long-Form Explainer
    - cron: '30 1 * * 1,3,5'
    # 2. Daily 01:30 PM IST (08:00 UTC): Citizen Rights & Dispute Guide Short
    - cron: '0 8 * * *'
    # 3. Daily 07:30 PM IST (14:00 UTC): Daily Civic Lifeline Alert Short
    - cron: '0 14 * * *'

  workflow_dispatch:
    inputs:
      pipeline_type:
        description: 'Video Broadcast Slot to Generate'
        type: choice
        options:
          - rights-shorts
          - civic-shorts
          - long-form
          - all
        default: 'rights-shorts'
      target_slug:
        description: 'Article Slug for Long-Form (optional, leaves empty for latest)'
        required: false
        default: ''
      dry_run:
        description: 'Dry Run Mode (true = render video only, no YouTube upload)'
        type: boolean
        default: false

concurrency:
  group: autonomous-youtube-bot
  cancel-in-progress: false

jobs:
  youtube-publish:
    name: Autonomous YouTube Video Production
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg, Tamil Fonts & Python TTS)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-taml fonts-noto-cjk python3 python3-pip
          pip3 install --quiet edge-tts

      - name: Install Node Dependencies
        run: npm ci

      - name: Execute YouTube Production Pipeline
        env:
          YOUTUBE_GEMINI_API_KEY: ${{ secrets.YOUTUBE_GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          NEXT_PUBLIC_VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.YOUTUBE_CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_CLOUDFLARE_API_TOKEN: ${{ secrets.YOUTUBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTA_ACCOUNT_ID: ${{ secrets.META_INSTA_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vizhitn.in' }}
          CHROME_BIN: '/usr/bin/google-chrome'
        run: |
          PIPELINE="${{ github.event.inputs.pipeline_type || 'auto' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          SLUG="${{ github.event.inputs.target_slug }}"

          EXTRA_FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi

          if [ "$PIPELINE" = "auto" ]; then
            CURRENT_HOUR=$(date -u +%H)
            if [ "$CURRENT_HOUR" -lt "5" ]; then
              echo "[AUTO TRIGGER] Morning Slot (07:00 AM IST): In-Depth Long-Form Documentary..."
              node scripts/youtube/pipelines/generate-long-video.mjs $EXTRA_FLAGS
            elif [ "$CURRENT_HOUR" -lt "11" ]; then
              echo "[AUTO TRIGGER] Lunchtime Slot (01:30 PM IST): Citizen Rights Dispute Guide..."
              node scripts/youtube/pipelines/generate-rights-shorts.mjs $EXTRA_FLAGS
            else
              echo "[AUTO TRIGGER] Evening Slot (07:30 PM IST): Daily Civic Lifeline Short..."
              node scripts/youtube/pipelines/generate-shorts.mjs $EXTRA_FLAGS
            fi
          elif [ "$PIPELINE" = "rights-shorts" ]; then
            echo "[DISPATCH] Executing Citizen Rights Dispute Guide Short..."
            node scripts/youtube/pipelines/generate-rights-shorts.mjs $EXTRA_FLAGS
          elif [ "$PIPELINE" = "civic-shorts" ]; then
            echo "[DISPATCH] Executing Daily Civic Lifeline Short..."
            node scripts/youtube/pipelines/generate-shorts.mjs $EXTRA_FLAGS
          elif [ "$PIPELINE" = "long-form" ]; then
            echo "[DISPATCH] Executing Long-Form Documentary Explainer..."
            if [ -n "$SLUG" ]; then
              node scripts/youtube/pipelines/generate-long-video.mjs --slug=$SLUG $EXTRA_FLAGS
            else
              node scripts/youtube/pipelines/generate-long-video.mjs $EXTRA_FLAGS
            fi
          elif [ "$PIPELINE" = "all" ]; then
            echo "[DISPATCH] Executing All Video Broadcast Pipelines..."
            node scripts/youtube/pipelines/generate-rights-shorts.mjs $EXTRA_FLAGS
            node scripts/youtube/pipelines/generate-shorts.mjs $EXTRA_FLAGS
            node scripts/youtube/pipelines/generate-long-video.mjs $EXTRA_FLAGS
          fi
