name: VizhiTN Autonomous YouTube Video Bot

on:
  schedule:
    # 1. Mon, Wed, Fri ~07:00 AM IST (01:22 UTC): 90-Day Long-Form Documentary (39 videos)
    - cron: '22 1 * * 1,3,5'
    # 2. Mon, Wed, Fri ~08:45 AM IST (03:18 UTC): Morning Safety Catch-Up Sweeper
    - cron: '18 3 * * 1,3,5'
    # 3. Daily ~01:25 PM IST (07:52 UTC): Daily Live Civic Pulse Short (Today's Real-Time Alerts)
    - cron: '52 7 * * *'
    # 4. Daily ~02:18 PM IST (08:48 UTC): Midday Safety Catch-Up Sweeper
    - cron: '48 8 * * *'
    # 5. Tue, Thu, Sat ~05:55 PM IST (12:22 UTC): 90-Day Vizhi Uncut Duo Podcast (38 episodes)
    - cron: '22 12 * * 2,4,6'
    # 6. Daily ~07:25 PM IST (13:52 UTC): 90-Day Daily Civic Lifeline Alert Short (90 shorts)
    - cron: '52 13 * * *'
    # 7. Daily ~08:48 PM IST (15:18 UTC): Evening Safety Catch-Up Sweeper
    - cron: '18 15 * * *'

  workflow_dispatch:
    inputs:
      pipeline_type:
        description: 'Video Broadcast Slot to Generate'
        type: choice
        options:
          - auto
          - live-shorts
          - civic-shorts
          - long-form
          - podcast
          - backfill
          - all
        default: 'auto'
      target_slug:
        description: 'Article Slug for Long-Form (optional, leaves empty for latest)'
        required: false
        default: ''
      dry_run:
        description: 'Dry Run Mode (true = render video only, no YouTube upload)'
        type: boolean
        default: false

concurrency:
  group: autonomous-youtube-bot
  cancel-in-progress: false

jobs:
  youtube-publish:
    name: Autonomous YouTube Video Production
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg, Tamil Fonts & Python TTS)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-taml fonts-noto-cjk python3 python3-pip
          pip3 install --quiet --upgrade "edge-tts>=7.3.1" --break-system-packages

      - name: Install Node Dependencies
        run: npm ci

      - name: Execute YouTube Production Pipeline
        env:
          YOUTUBE_GEMINI_API_KEY: ${{ secrets.YOUTUBE_GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          NEXT_PUBLIC_VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.YOUTUBE_CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_CLOUDFLARE_API_TOKEN: ${{ secrets.YOUTUBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTA_ACCOUNT_ID: ${{ secrets.META_INSTA_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vizhitn.in' }}
          CHROME_BIN: '/usr/bin/google-chrome'
        run: |
          PIPELINE="${{ github.event.inputs.pipeline_type || 'auto' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          SCHEDULE="${{ github.event.schedule }}"

          EXTRA_FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi

          SLOT_ARG="--slot=$PIPELINE"
          if [ "$PIPELINE" = "backfill" ]; then
            SLOT_ARG="--backfill"
          elif [ -z "$PIPELINE" ] || [ "$PIPELINE" = "auto" ]; then
            if [ "$SCHEDULE" = "22 1 * * 1,3,5" ]; then
              SLOT_ARG="--slot=long-form"
            elif [ "$SCHEDULE" = "52 7 * * *" ]; then
              SLOT_ARG="--slot=live-shorts"
            elif [ "$SCHEDULE" = "22 12 * * 2,4,6" ]; then
              SLOT_ARG="--slot=podcast"
            elif [ "$SCHEDULE" = "52 13 * * *" ]; then
              SLOT_ARG="--slot=civic-shorts"
            elif [ "$SCHEDULE" = "18 3 * * 1,3,5" ] || [ "$SCHEDULE" = "48 8 * * *" ] || [ "$SCHEDULE" = "18 15 * * *" ]; then
              SLOT_ARG="--backfill"
            else
              SLOT_ARG="--slot=auto"
            fi
          fi

          echo "[DISPATCH] Executing VizhiTN 90-Day YouTube Dispatcher ($SLOT_ARG $EXTRA_FLAGS)..."
          node scripts/youtube/dispatch-broadcast.mjs $SLOT_ARG $EXTRA_FLAGS
