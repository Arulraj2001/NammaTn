name: VizhiTN Autonomous TN Today Bot

on:
  schedule:
    # 02:15 UTC = 07:45 AM IST (Daily Flagship Edition: 1 High-Impact Article / Day)
    - cron: '15 2 * * *'

  workflow_dispatch:
    inputs:
      pulse:
        description: 'Editorial Pulse or Beat to execute (auto, transit-infra, welfare-health, economy-industry, environment-water, egov-revenue, agriculture-delta, citizen-rights)'
        required: true
        default: 'auto'
        type: string

concurrency:
  group: autonomous-tntoday-bot
  cancel-in-progress: false

jobs:
  tntoday-dispatch:
    name: Generate & Publish Daily Flagship TN Today Article
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Autonomous TN Today Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEW_GEMINI_API_KEY: ${{ secrets.NEW_GEMINI_API_KEY }}
          YOUTUBE_GEMINI_API_KEY: ${{ secrets.YOUTUBE_GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vizhitn.in' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL || '@cf/black-forest-labs/flux-1-schnell' }}
          WHATSAPP_SESSION: ${{ secrets.WHATSAPP_SESSION }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_INSTA_ACCOUNT_ID: ${{ secrets.META_INSTA_ACCOUNT_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          INPUT_PULSE="${{ github.event.inputs.pulse }}"
          if [ -n "$INPUT_PULSE" ] && [ "$INPUT_PULSE" != "auto" ]; then
            echo "Executing manually requested pulse: $INPUT_PULSE"
            node scripts/auto-tntoday-poster.mjs --pulse="$INPUT_PULSE"
          else
            echo "Executing autonomous daily flagship edition at 07:45 AM IST"
            node scripts/auto-tntoday-poster.mjs --pulse="auto"
          fi

      - name: Ping Search Engines via IndexNow
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vizhitn.in' }}
        run: npm run indexnow:all || true
