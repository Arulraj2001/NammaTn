name: VizhiTN Autonomous Student Mindset & Discipline Bot

on:
  schedule:
    # Slot 1: Morning Focus Priming — 00:45 UTC = 06:15 AM IST (Primes students before morning study block)
    - cron: '45 0 * * *'
    # Slot 2: Afternoon Slump Destroyer — 09:00 UTC = 02:30 PM IST (Breaks post-lunch phone scrolling trance)
    - cron: '0 9 * * *'

  workflow_dispatch:
    inputs:
      slot:
        description: 'Broadcast Slot to Execute'
        type: choice
        options:
          - auto
          - morning
          - afternoon
        default: 'auto'
      topic_index:
        description: 'Specific Topic Index (0-7, leave blank for auto-rotation)'
        type: string
        default: ''
      dry_run:
        description: 'Dry Run Mode (true = render video only, no YouTube/Meta upload)'
        type: boolean
        default: false

concurrency:
  group: autonomous-mindset-bot
  cancel-in-progress: false

jobs:
  mindset-shorts-publish:
    name: Produce & Distribute Student Mindset Reel
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg, Tamil Fonts & Python Edge-TTS)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core fonts-noto-hinted fonts-taml fontconfig python3 python3-pip
          fc-cache -fv
          pip3 install --quiet --upgrade "edge-tts>=7.3.1" --break-system-packages

      - name: Install Node Dependencies
        run: npm ci

      - name: Cache Render Assets and B-Roll
        uses: actions/cache@v4
        with:
          path: |
            scripts/youtube/assets/broll_cache
            scripts/youtube/assets/music_cache
            scripts/youtube/assets/sfx
          key: mindset-render-cache-${{ github.run_id }}
          restore-keys: |
            mindset-render-cache-

      - name: Execute Mindset Shorts Pipeline
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEW2_GEMINI_API_KEY: ${{ secrets.NEW2_GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTA_ACCOUNT_ID: ${{ secrets.META_INSTA_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          SLOT_ARG="--slot=${{ github.event.inputs.slot || 'auto' }}"
          DRY_RUN_ARG="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          TOPIC_ARG=""
          if [ -n "${{ github.event.inputs.topic_index }}" ]; then
            TOPIC_ARG="--topic=${{ github.event.inputs.topic_index }}"
          fi
          
          echo "Executing Mindset Engine with: $SLOT_ARG $DRY_RUN_ARG $TOPIC_ARG"
          node scripts/youtube/pipelines/generate-mindset-shorts.mjs $SLOT_ARG $DRY_RUN_ARG $TOPIC_ARG

