name: VizhiTN Autonomous Daily Digest Bot

on:
  schedule:
    # 13:37 UTC = 07:07 PM IST (Daily Evening Governance & Development Roundup)
    - cron: '37 13 * * *'

  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date for Digest (YYYY-MM-DD or empty for today)'
        required: false
        default: ''
      dry_run:
        description: 'Dry Run Mode (true/false)'
        required: false
        default: 'false'

concurrency:
  group: autonomous-daily-digest
  cancel-in-progress: false

jobs:
  daily-digest:
    name: Generate & Publish Daily 7 PM IST Digest
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily TN Digest Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          NEXT_PUBLIC_VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://hzgrzcablefquddisqkf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vizhitn.in' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL || '@cf/black-forest-labs/flux-1-schnell' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_INSTA_ACCOUNT_ID: ${{ secrets.META_INSTA_ACCOUNT_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          WHATSAPP_SESSION: ${{ secrets.WHATSAPP_SESSION }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --date=${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Executing: node scripts/daily-tn-digest.mjs $ARGS"
          node scripts/daily-tn-digest.mjs $ARGS
