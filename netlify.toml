[build]
  command = "npm run build"
  publish = ".next"
  ignore = "exit 0" # Cancels all Netlify builds on git push to save credits


[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  NPM_FLAGS = "--include=dev"
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/media/*"
  to = "https://hzgrzcablefquddisqkf.supabase.co/storage/v1/object/public/media/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/storage/v1/object/public/media/*"
  to = "https://hzgrzcablefquddisqkf.supabase.co/storage/v1/object/public/media/:splat"
  status = 301
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"




