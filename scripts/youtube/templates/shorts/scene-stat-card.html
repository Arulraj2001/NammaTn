<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@700;800;900&family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #0c1c38 0%, #071224 100%);
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #ffffff;
      position: relative;
    }

    /* Ambient Glow Behind Metric */
    .glow-orb {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, transparent 70%);
      top: 300px;
      left: 190px;
      pointer-events: none;
    }

    /* Top Broadcast Bar */
    .broadcast-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 96px;
      background: rgba(7, 18, 36, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 44px;
      z-index: 30;
    }
    .brand-pill {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo-img {
      width: 54px; height: 54px;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
      padding: 3px;
    }
    .brand-name {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .report-badge {
      background: rgba(14, 165, 233, 0.18);
      border: 1.5px solid #0ea5e9;
      color: #38bdf8;
      font-size: 18px;
      font-weight: 900;
      padding: 8px 22px;
      border-radius: 9999px;
      letter-spacing: 1.5px;
    }

    /* Main Container */
    .content-area {
      position: absolute;
      top: 140px;
      left: 44px;
      right: 44px;
      display: flex;
      flex-direction: column;
      gap: 36px;
      z-index: 10;
    }

    /* Category & Context Tag */
    .tag-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 22px;
      border-radius: 9999px;
      font-size: 20px;
      font-weight: 900;
      background: {{CATEGORY_COLOR}}22;
      border: 1.5px solid {{CATEGORY_COLOR}};
      color: {{CATEGORY_COLOR}};
    }
    .status-badge {
      background: rgba(34, 197, 94, 0.18);
      border: 1.5px solid #22c55e;
      color: #4ade80;
      font-size: 18px;
      font-weight: 800;
      padding: 8px 20px;
      border-radius: 9999px;
    }

    /* Huge Hero Stat Card */
    .stat-hero-card {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(56, 189, 248, 0.35);
      border-radius: 32px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }
    .stat-hero-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #f43f5e);
    }
    .stat-number {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 120px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 60%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .stat-label-ta {
      font-size: 36px;
      font-weight: 900;
      color: #f1f5f9;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .stat-desc-en {
      font-size: 20px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Key Points / Affected Areas Breakdown */
    .breakdown-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 36px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .breakdown-title {
      font-size: 26px;
      font-weight: 900;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .point-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      border-left: 4px solid #38bdf8;
    }
    .point-bullet {
      font-size: 22px;
      color: #38bdf8;
      line-height: 1.2;
    }
    .point-text {
      font-size: 24px;
      font-weight: 800;
      color: #f8fafc;
      line-height: 1.4;
    }

    /* Bottom Source & Helpline Banner */
    .bottom-bar {
      position: absolute;
      bottom: 40px;
      left: 44px;
      right: 44px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }
    .source-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .source-label {
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .source-val {
      font-size: 20px;
      font-weight: 800;
      color: #e2e8f0;
    }
    .helpline-pill {
      background: #dc2626;
      color: #fff;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 22px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(220, 38, 38, 0.5);
    }
  </style>
</head>
<body>
  <div class="glow-orb"></div>

  <!-- Top Broadcast Bar -->
  <header class="broadcast-bar">
    <div class="brand-pill">
      <img src="{{BRAND_LOGO_DATA_URI}}" class="brand-logo-img" alt="VizhiTN">
      <span class="brand-name">VIZHI TN</span>
    </div>
    <div class="report-badge">📊 DATA VERIFIED</div>
  </header>

  <!-- Main Content -->
  <main class="content-area">
    <div class="tag-row">
      <div class="category-badge">
        <span>{{CATEGORY_ICON}}</span>
        <span>{{CATEGORY_LABEL}}</span>
      </div>
      <div class="status-badge">✓ அரசு அதிகாரப்பூர்வ தரவு</div>
    </div>

    <!-- Massive Hero Stat Card -->
    <div class="stat-hero-card">
      <div class="stat-number">{{STAT_METRIC}}</div>
      <div class="stat-label-ta">{{STAT_LABEL_TA}}</div>
      <div class="stat-desc-en">{{STAT_DESC_EN}}</div>
    </div>

    <!-- Affected Areas & Data Breakdown List -->
    <div class="breakdown-box">
      <div class="breakdown-title">
        <span>📍</span>
        <span>கள நிலவர விவரங்கள்:</span>
      </div>
      {{POINTS_HTML}}
    </div>
  </main>

  <!-- Bottom Source / Helpline Bar -->
  <footer class="bottom-bar">
    <div class="source-col">
      <span class="source-label">துறை ஆதாரம் / SOURCE</span>
      <span class="source-val">{{SOURCE_NAME}}</span>
    </div>
    <div class="helpline-pill">
      <span>📞</span>
      <span>{{HELPLINE_NUM}}</span>
    </div>
  </footer>
</body>
</html>
