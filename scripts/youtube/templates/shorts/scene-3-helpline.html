<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@700;800;900&family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #172554 0%, #0b132b 45%, #020617 100%);
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      position: relative;
      color: #ffffff;
    }

    /* Ambient background glows */
    .bg-glow-top {
      position: absolute;
      top: -120px; left: 50%;
      transform: translateX(-50%);
      width: 850px; height: 550px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.35) 0%, transparent 70%);
      pointer-events: none;
    }
    .bg-glow-mid {
      position: absolute;
      top: 500px; left: 50%;
      transform: translateX(-50%);
      width: 900px; height: 600px;
      background: radial-gradient(circle, rgba(220, 38, 38, 0.22) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Floating Header (Safely Below Mobile Top Bar at Y = 170px) ── */
    .floating-header, .broadcast-bar {
      position: absolute;
      top: 170px;
      left: 48px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 20;
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      padding: 8px 18px 8px 10px;
      border-radius: 9999px;
    }
    .brand-logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 10px;
      background: #ffffff;
      padding: 2px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .badge-helpline-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.2);
      border: 1.5px solid #f59e0b;
      color: #fbbf24;
      font-size: 19px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 9999px;
      letter-spacing: 1px;
    }

    /* ── Hero Helpline Card (Safe Y = 280px to Y = 820px, Safe Right = 180px) ── */
    .hero-helpline-card {
      position: absolute;
      top: 280px;
      left: 48px;
      right: 180px; /* Safe from Like/Share vertical column */
      z-index: 20;
      background: rgba(10, 15, 30, 0.94);
      backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-left: 6px solid #ef4444;
      border-radius: 30px;
      padding: 34px 34px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
    }

    .card-top-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(220, 38, 38, 0.2);
      border: 1.5px solid #ef4444;
      color: #fca5a5;
      padding: 6px 20px;
      border-radius: 9999px;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .dept-title {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.3;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .dept-sub {
      font-size: 19px;
      font-weight: 700;
      color: #94a3b8;
    }

    /* Giant High-Impact Phone Button */
    .hl-giant-btn {
      width: 100%;
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      color: #ffffff;
      padding: 20px 28px;
      border-radius: 22px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 12px 35px rgba(220, 38, 38, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .hl-call-icon {
      font-size: 40px;
    }
    .hl-giant-number {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 2px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .hl-status-footer {
      font-size: 17px;
      font-weight: 800;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Community Portal Card (Y = 860px, Safe Right = 180px) ── */
    .portal-card {
      position: absolute;
      top: 860px;
      left: 48px;
      right: 180px;
      z-index: 20;
      background: rgba(10, 15, 30, 0.92);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      border-left: 6px solid #38bdf8;
      border-radius: 24px;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
    }
    .portal-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .portal-url {
      font-size: 26px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }
    .portal-desc {
      font-size: 16px;
      font-weight: 700;
      color: #cbd5e1;
    }
    .portal-badge {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 15px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 9999px;
      white-space: nowrap;
    }

    /* Bottom 470px is 100% negative space reserved for YouTube Native Controls */
  </style>
</head>
<body>
  <div class="bg-glow-top"></div>
  <div class="bg-glow-mid"></div>

  <!-- Floating Mobile Header (Y = 170px) -->
  <div class="floating-header broadcast-bar">
    <div class="brand-pill">
      <img class="brand-logo-img" src="{{BRAND_LOGO_DATA_URI}}" alt="VizhiTN" />
      <span class="brand-name">VizhiTN</span>
    </div>
    <div class="badge-helpline-pill">📞 அவசர உதவி மையம்</div>
  </div>

  <!-- Hero Helpline Card (Y = 280px to Y = 820px) -->
  <div class="hero-helpline-card">
    <div class="card-top-chip">அதிகாரப்பூர்வ உதவி எண்</div>
    <h2 class="dept-title">{{ASSIGNED_DEPT}}</h2>
    <p class="dept-sub">மற்றும் அவசர சேவை உடனடி நடவடிக்கை</p>
    
    <div class="hl-giant-btn">
      <span class="hl-call-icon">📞</span>
      <span class="hl-giant-number">{{HELPLINE_NUMBER}}</span>
    </div>

    <div class="hl-status-footer">
      <span>●</span>
      <span>இலவச உடனடி அழைப்பு • 24 மணி நேர சேவை (1912 / 1913)</span>
    </div>
  </div>

  <!-- Community Portal Card (Y = 860px) -->
  <div class="portal-card">
    <div class="portal-left">
      <span class="portal-url">🌐 vizhitn.in</span>
      <span class="portal-desc">பொதுமக்கள் நேரடி கள அறிக்கை தளம்</span>
    </div>
    <div class="portal-badge">உண்மை நிலவரம்</div>
  </div>
</body>
</html>
