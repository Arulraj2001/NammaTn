<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Noto Sans Tamil';
      src: url('file:///{{FONTS_DIR}}/NotoSansTamil-Bold.ttf') format('truetype');
      font-weight: 700 900;
      font-style: normal;
      font-display: block;
    }
  </style>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #1e293b 0%, #0b1329 55%, #020617 100%);
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      position: relative;
      color: #ffffff;
    }

    .glow-aura {
      position: absolute;
      top: 25%; left: 50%;
      transform: translate(-50%, -50%);
      width: 950px; height: 950px;
      background: radial-gradient(circle, rgba(220, 38, 38, 0.22) 0%, rgba(56, 189, 248, 0.08) 50%, transparent 70%);
      pointer-events: none;
    }

    /* Top Broadcast Bar */
    .broadcast-bar {
      position: absolute;
      top: 130px; left: 54px; right: 54px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 20;
    }
    .brand-pill {
      display: inline-flex; align-items: center; gap: 12px;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      padding: 10px 24px 10px 14px; border-radius: 9999px;
    }
    .brand-logo-img { width: 38px; height: 38px; border-radius: 10px; background: #ffffff; padding: 2px; }
    .brand-name { font-size: 22px; font-weight: 900; }
    .verified-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(16, 185, 129, 0.2); border: 1.5px solid #10b981;
      color: #6ee7b7; padding: 10px 22px; border-radius: 9999px;
      font-size: 18px; font-weight: 900; letter-spacing: 0.5px;
    }

    /* Central Stage */
    .hero-stage {
      position: absolute;
      top: 260px; left: 54px; right: 54px;
      display: flex; flex-direction: column; gap: 24px;
      z-index: 20;
    }

    .on-screen-banner {
      background: #ef4444;
      color: #ffffff;
      font-size: 32px;
      font-weight: 900;
      padding: 14px 28px;
      border-radius: 18px;
      display: inline-block;
      align-self: flex-start;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
      letter-spacing: -0.5px;
    }

    /* 1. Official Emergency Helpline Card */
    .helpline-box {
      width: 100%;
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.95) 0%, rgba(185, 28, 28, 0.95) 100%);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 28px;
      padding: 24px 32px;
      box-shadow: 0 20px 50px rgba(220, 38, 38, 0.5);
      display: flex; align-items: center; justify-content: space-between;
    }
    .hl-left { display: flex; flex-direction: column; gap: 6px; }
    .hl-dept { font-size: 18px; font-weight: 800; color: #fef2f2; letter-spacing: 0.5px; }
    .hl-title { font-size: 26px; font-weight: 900; color: #ffffff; }
    .hl-right { display: flex; flex-direction: column; align-items: flex-end; }
    .hl-number {
      font-size: 56px; font-weight: 900; letter-spacing: 2px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #ffffff; text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .hl-status { font-size: 15px; font-weight: 800; color: #fef08a; }

    /* 2. Single Subscribe Hero Card */
    .subscribe-hero-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(24px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 32px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 20px;
    }
    .cta-header-tag { font-size: 18px; font-weight: 900; color: #38bdf8; letter-spacing: 1px; text-transform: uppercase; }
    .cta-main-title { font-size: 32px; font-weight: 900; line-height: 1.35; color: #ffffff; }

    .yt-subscribe-btn {
      width: 100%;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 9999px;
      padding: 18px 32px;
      display: flex; align-items: center; justify-content: center; gap: 14px;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.6);
    }
    .yt-icon {
      width: 32px; height: 24px; background: #ffffff; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .yt-play-triangle {
      width: 0; height: 0;
      border-top: 6px solid transparent; border-bottom: 6px solid transparent;
      border-left: 10px solid #ef4444; margin-left: 2px;
    }
    .yt-subscribe-text { font-size: 26px; font-weight: 900; letter-spacing: 1.5px; }
    .bell-icon { font-size: 28px; }

    /* 3. Community Dispatch Citizen Portal Card */
    .portal-callout-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .portal-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .portal-icon { font-size: 28px; }
    .portal-text { font-size: 18px; font-weight: 800; color: #cbd5e1; }
    .portal-url {
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: rgba(56, 189, 248, 0.12);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
  </style>
</head>
<body>
  <div class="glow-aura"></div>

  <header class="broadcast-bar">
    <div class="brand-pill">
      <img class="brand-logo-img" src="{{BRAND_LOGO_DATA_URI}}" alt="VizhiTN" />
      <span class="brand-name">VizhiTN</span>
    </div>
    <div class="verified-pill">✓ அதிகாரப்பூர்வ சேவை</div>
  </header>

  <main class="hero-stage">
    <div class="on-screen-banner">{{ON_SCREEN_TEXT}}</div>

    <!-- 1. Emergency Helpline -->
    <div class="helpline-box">
      <div class="hl-left">
        <span class="hl-dept">{{ASSIGNED_DEPT}}</span>
        <span class="hl-title">📞 அதிகாரப்பூர்வ உதவி எண்</span>
      </div>
      <div class="hl-right">
        <span class="hl-number">{{HELPLINE_NUMBER}}</span>
        <span class="hl-status">● 24x7 உடனடி சேவை</span>
      </div>
    </div>

    <!-- 2. Single CTA Subscribe Hero -->
    <div class="subscribe-hero-card">
      <span class="cta-header-tag">🔔 தினசரி தமிழ்நாடு எச்சரிக்கைகள்</span>
      <h2 class="cta-main-title">உண்மை செய்திகளுக்கு இப்போதே இணையுங்கள்!</h2>

      <div class="yt-subscribe-btn">
        <div class="yt-icon">
          <div class="yt-play-triangle"></div>
        </div>
        <span class="yt-subscribe-text">SUBSCRIBE</span>
        <span class="bell-icon">🔔</span>
      </div>
    </div>

    <!-- 3. Citizen Portal Footer Box -->
    <div class="portal-callout-card">
      <div class="portal-left">
        <span class="portal-icon">📢</span>
        <span class="portal-text">உங்கள் பகுதி பிரச்சனைகளை பதிவு செய்ய:</span>
      </div>
      <span class="portal-url">vizhitn.in</span>
    </div>
  </main>
</body>
</html>
