<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@700;800;900&family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(7, 18, 36, 0.82) 0%, rgba(7, 18, 36, 0.38) 25%, rgba(7, 18, 36, 0.45) 70%, rgba(7, 18, 36, 0.94) 100%);
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #ffffff;
      position: relative;
    }

    /* ── Broadcast Top Bar ────────────────────────────────── */
    .broadcast-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 88px;
      background: rgba(7,18,36,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 2px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 30;
    }
    .brand-pill {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-logo-img {
      width: 52px; height: 52px;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
      padding: 3px;
    }
    .brand-name {
      font-size: 30px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .broadcast-badge {
      background: rgba(37,99,235,0.2);
      border: 1.5px solid #3b82f6;
      color: #93c5fd;
      font-size: 18px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 9999px;
      letter-spacing: 1.5px;
    }

    /* ── Section Title Band ───────────────────────────────── */
    .section-band {
      position: absolute;
      top: 96px; left: 0; right: 0;
      background: linear-gradient(90deg, #1e3a8a 0%, rgba(30,58,138,0.4) 100%);
      border-bottom: 2px solid rgba(56,189,248,0.3);
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      gap: 16px;
      z-index: 20;
    }
    .section-icon {
      font-size: 32px;
      line-height: 1;
    }
    .section-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .section-count {
      margin-left: auto;
      background: rgba(56,189,248,0.15);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 20px;
      font-weight: 900;
      padding: 5px 16px;
      border-radius: 9999px;
      letter-spacing: 1px;
    }

    /* ── Alert Cards Stack ────────────────────────────────── */
    .alerts-stack {
      position: absolute;
      top: 184px;
      left: 32px; right: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .alert-card {
      background: rgba(15,23,42,0.84);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255,255,255,0.16);
      border-left: 8px solid #2563eb;
      border-radius: 22px;
      padding: 28px 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    .alert-card.warn { border-left-color: #f59e0b; }
    .alert-card.danger { border-left-color: #ef4444; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .cat-name {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.8px;
    }
    .dist-name {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 5px 14px;
      font-size: 18px;
      font-weight: 800;
      color: #cbd5e1;
    }
    .card-title {
      font-size: 30px;
      font-weight: 900;
      line-height: 1.35;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .card-timing {
      font-size: 21px;
      font-weight: 700;
      color: #fbbf24;
      line-height: 1.4;
    }

    /* ── Confidence Bar (visual data element) ─────────────── */
    .confidence-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }
    .confidence-label {
      font-size: 17px;
      font-weight: 800;
      color: #64748b;
      flex-shrink: 0;
    }
    .confidence-bar-bg {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 9999px;
      overflow: hidden;
    }
    .confidence-bar-fill {
      height: 6px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #22d3ee, #38bdf8);
    }
    .confidence-pct {
      font-size: 17px;
      font-weight: 900;
      color: #38bdf8;
      flex-shrink: 0;
    }

    /* ── Bottom Anchor Bar ────────────────────────────────── */
    .bottom-anchor {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 110px;
      background: rgba(7,18,36,0.97);
      border-top: 2px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      padding: 0 40px;
      gap: 16px;
      z-index: 30;
    }
    .anchor-site {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .anchor-url {
      font-size: 32px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .anchor-tagline {
      font-size: 20px;
      font-weight: 700;
      color: #64748b;
    }
    .anchor-action-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      padding: 14px 28px;
      border-radius: 14px;
      text-align: center;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(37,99,235,0.4);
    }
  </style>
</head>
<body>
  <!-- Broadcast Top Bar -->
  <div class="broadcast-bar">
    <div class="brand-pill">
      <img class="brand-logo-img" src="{{BRAND_LOGO_DATA_URI}}" alt="VizhiTN" />
      <span class="brand-name">VizhiTN | மக்கள் களம்</span>
    </div>
    <div class="broadcast-badge">TODAY'S DIGEST</div>
  </div>

  <!-- Section Band -->
  <div class="section-band">
    <span class="section-icon">⚡</span>
    <span class="section-title">{{DIGEST_TITLE_TA}}</span>
    <span class="section-count">LIVE</span>
  </div>

  <!-- Alert Cards -->
  <div class="alerts-stack">
    {{ALERTS_CARDS_HTML}}
  </div>

  <!-- Bottom Anchor -->
  <div class="bottom-anchor">
    <div class="anchor-site">
      <div class="anchor-url">🌐 vizhitn.in</div>
      <div class="anchor-tagline">உங்க பிரச்சனையை நீங்களே பதிவு பண்ணுங்க</div>
    </div>
    <div class="anchor-action-btn">புகார் பதிவு ➔</div>
  </div>
</body>
</html>
