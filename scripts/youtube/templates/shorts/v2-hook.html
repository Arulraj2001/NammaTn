<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Noto Sans Tamil';
      src: url('file:///{{FONTS_DIR}}/NotoSansTamil-Bold.ttf') format('truetype');
      font-weight: 700 900;
      font-style: normal;
      font-display: block;
    }
  </style>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      overflow: hidden;
      background: linear-gradient(160deg, #1E1B4B 0%, #111340 40%, #0B1230 100%);
      font-family: 'Noto Sans Tamil', system-ui, sans-serif;
      color: #ffffff;
      position: relative;
    }
    .halftone {
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.09) 2px, transparent 2.6px);
      background-size: 34px 34px;
      z-index: 1;
    }
    .speedlines {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(115deg, transparent 0 42px, rgba(255,255,255,0.045) 42px 43px);
      z-index: 1;
    }
    .bg-photo {
      position: absolute; top: 0; left: 0;
      width: 1080px; height: 1920px;
      object-fit: cover;
      filter: grayscale(1) contrast(1.12) brightness(0.72);
      z-index: 0;
    }
    .photo-tint {
      position: absolute; inset: 0;
      background: {{CATEGORY_COLOR}};
      mix-blend-mode: color;
      opacity: 0.42;
      z-index: 0;
    }
    .photo-vignette {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(11,18,48,0.55) 0%, rgba(11,18,48,0.1) 30%, rgba(11,18,48,0.25) 55%, rgba(11,18,48,0.96) 100%);
      z-index: 1;
    }
    .brand-bar {
      position: absolute; top: 170px; left: 48px; right: 48px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 20;
    }
    .brand-pill {
      display: inline-flex; align-items: center; gap: 14px;
      background: rgba(10, 15, 30, 0.88);
      border: 2.5px solid rgba(255,255,255,0.85);
      box-shadow: 8px 8px 0 rgba(0,0,0,0.35);
      padding: 10px 22px 10px 12px;
      border-radius: 14px;
    }
    .brand-logo-img { width: 44px; height: 44px; object-fit: contain; border-radius: 10px; background: #fff; padding: 2px; }
    .brand-name { font-size: 26px; font-weight: 900; letter-spacing: 0.5px; }
    .category-chip {
      display: inline-flex; align-items: center; gap: 10px;
      background: {{CATEGORY_COLOR}};
      border: 2.5px solid #ffffff;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.35);
      color: #071224;
      font-size: 22px; font-weight: 900;
      padding: 12px 24px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }
    .headline-card {
      position: absolute;
      top: 470px; left: 56px; right: 180px;
      z-index: 20;
      background: rgba(8, 12, 28, 0.92);
      border: 5px solid #ffffff;
      border-left: 14px solid {{CATEGORY_COLOR}};
      border-radius: 26px;
      box-shadow: 18px 18px 0 rgba(0,0,0,0.45);
      padding: 44px 40px;
    }
    .headline-burst {
      position: absolute;
      top: -70px; right: -40px;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0 12%, transparent 13% 100%);
      background-size: 26px 26px;
      opacity: 0.9;
      z-index: -1;
    }
    .headline-kicker {
      display: inline-flex; align-items: center; gap: 8px;
      background: {{CATEGORY_COLOR}};
      color: #071224;
      font-size: 21px; font-weight: 900;
      padding: 8px 20px;
      border-radius: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .hook-headline {
      margin-top: 26px;
      font-size: 64px; font-weight: 900;
      line-height: 1.28;
      color: #ffffff;
      text-shadow: 0 4px 0 {{CATEGORY_COLOR}}, 0 8px 18px rgba(0,0,0,0.8);
      letter-spacing: -0.5px;
    }
    .meta-bar {
      position: absolute; bottom: 150px; left: 56px; right: 56px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      z-index: 20;
    }
    .district-stamp {
      display: inline-flex; align-items: center; gap: 12px;
      background: rgba(8,12,28,0.9);
      border: 3px solid rgba(255,255,255,0.85);
      box-shadow: 8px 8px 0 rgba(0,0,0,0.35);
      font-size: 23px; font-weight: 900; letter-spacing: 1px;
      padding: 14px 26px; border-radius: 12px;
      color: #ffffff;
    }
    .urgency-chip {
      background: #dc2626;
      border: 2.5px solid #fff;
      color: #fff;
      font-size: 19px; font-weight: 900;
      padding: 12px 22px; border-radius: 999px;
      letter-spacing: 1px;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.35);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .date-text {
      font-size: 19px; font-weight: 800;
      color: #c7d2fe;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <img class="bg-photo" src="{{SCENE_PHOTO_SRC}}" alt="" />
  <div class="photo-tint"></div>
  <div class="photo-vignette"></div>
  <div class="halftone"></div>
  <div class="speedlines"></div>

  <div class="brand-bar">
    <div class="brand-pill">
      <img class="brand-logo-img" src="{{BRAND_LOGO_DATA_URI}}" alt="VizhiTN" />
      <span class="brand-name">VizhiTN</span>
    </div>
    <div class="category-chip"><span>{{CATEGORY_ICON}}</span><span>{{CATEGORY_LABEL}}</span></div>
  </div>

  <div class="headline-card">
    <div class="headline-burst"></div>
    <div class="headline-kicker">⚡ {{DATE_TEXT}}</div>
    <h1 class="hook-headline">{{HOOK_HEADLINE_TA}}</h1>
  </div>

  <div class="meta-bar">
    <div class="district-stamp">📍 {{DISTRICT_NAME}}</div>
    <div class="urgency-chip {{URGENCY_CLASS}}"><span>🔴</span><span>நேரடி கள தகவல்</span></div>
  </div>
  <div class="meta-bar" style="bottom: 60px; justify-content: flex-end;"><span class="date-text">vizhitn.in • மக்கள் கள அறிக்கை</span></div>
</body>
</html>
