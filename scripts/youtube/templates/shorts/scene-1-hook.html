<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Noto Sans Tamil';
      src: url('file:///{{FONTS_DIR}}/NotoSansTamil-Bold.ttf') format('truetype');
      font-weight: 700 900;
      font-style: normal;
      font-display: block;
    }
  </style>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #020617;
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      position: relative;
      color: #ffffff;
    }

    /* ── Full Bleed Photorealistic Visual Plate ─────────── */
    .bg-photo {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      object-fit: cover;
      filter: contrast(1.18) saturate(1.22) brightness(0.9);
    }
    .cinematic-vignette {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      background: linear-gradient(
        180deg,
        rgba(2, 6, 23, 0.88) 0%,
        rgba(2, 6, 23, 0.3) 22%,
        rgba(2, 6, 23, 0.2) 60%,
        rgba(2, 6, 23, 0.8) 85%,
        rgba(2, 6, 23, 0.98) 100%
      );
    }

    /* ── Floating Header (Safely Below Mobile Top Bar at Y = 170px) ── */
    .floating-header, .broadcast-bar {
      position: absolute;
      top: 170px;
      left: 48px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 20;
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      padding: 8px 18px 8px 10px;
      border-radius: 9999px;
    }
    .brand-logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 10px;
      background: #ffffff;
      padding: 2px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .district-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .live-alert-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #dc2626;
      border: 1.5px solid #ef4444;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 19px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1.5px;
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.7);
    }
    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
    }

    /* ── Breaking News Card (Solid Glass Container for 100% Readability) ── */
    .news-card {
      position: absolute;
      top: 260px;
      left: 48px;
      right: 180px; /* Safe from Like/Share column */
      z-index: 20;
      background: rgba(10, 15, 30, 0.94);
      backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-left: 6px solid {{CATEGORY_COLOR}};
      border-radius: 24px;
      padding: 24px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 19px;
      font-weight: 900;
      color: {{CATEGORY_COLOR}};
      letter-spacing: 0.5px;
    }
    .card-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .hook-headline {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.3;
      color: #ffffff;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.9);
      letter-spacing: -0.5px;
    }
    .card-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }

    /* Bottom 470px is 100% negative space reserved for YouTube Native Controls */
  </style>
</head>
<body>
  <!-- Full Bleed Photorealistic Visual -->
  <img class="bg-photo" src="{{SCENE_PHOTO_SRC}}" alt="Visual" />
  <div class="cinematic-vignette"></div>

  <!-- Floating Mobile Header (Y = 170px) -->
  <div class="floating-header broadcast-bar">
    <div class="brand-pill">
      <img class="brand-logo-img" src="{{BRAND_LOGO_DATA_URI}}" alt="VizhiTN" />
      <span class="brand-name">VizhiTN</span>
    </div>
    <div class="district-pill">📍 {{DISTRICT_NAME}}</div>
    <div class="live-alert-pill">
      <div class="live-dot"></div>
      அலர்ட்
    </div>
  </div>

  <!-- Breaking News Card (Y = 260px) -->
  <div class="news-card">
    <div class="card-top-row">
      <div class="category-badge">
        <span>{{CATEGORY_ICON}}</span>
        <span>{{CATEGORY_LABEL}}</span>
      </div>
      <div class="card-status-pill">
        <span>🔴</span>
        <span>நேரடி கள தகவல்</span>
      </div>
    </div>
    <h1 class="hook-headline">{{HOOK_HEADLINE_TA}}</h1>
    <div class="card-footer">
      <span>📍 {{DISTRICT_NAME}}</span>
      <span>•</span>
      <span>உண்மை நிலவரம் உடனே அறிக</span>
    </div>
  </div>
</body>
</html>
