<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@700;800;900&family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #020617;
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      position: relative;
      color: #ffffff;
    }

    /* ── Full Bleed Photorealistic Visual Plate ─────────── */
    .bg-photo {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      object-fit: cover;
      filter: contrast(1.22) saturate(1.35) brightness(0.88);
    }
    .cinematic-vignette {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      background: linear-gradient(
        180deg,
        rgba(2, 6, 23, 0.82) 0%,
        rgba(2, 6, 23, 0.25) 25%,
        rgba(2, 6, 23, 0.15) 60%,
        rgba(2, 6, 23, 0.80) 82%,
        rgba(2, 6, 23, 0.98) 100%
      );
    }

    /* ── Floating Header (Safely Below Mobile Top Bar at Y = 170px) ── */
    .floating-header, .broadcast-bar {
      position: absolute;
      top: 170px;
      left: 48px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 20;
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      padding: 8px 18px 8px 10px;
      border-radius: 9999px;
    }
    .brand-logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 10px;
      background: #ffffff;
      padding: 2px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .district-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .live-alert-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #dc2626;
      border: 1.5px solid #ef4444;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 19px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1.5px;
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.7);
    }
    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
    }

    /* ── Upper-Third Hook Headline (Safe Right Margin: 180px for Action Buttons) ── */
    .hook-container {
      position: absolute;
      top: 275px;
      left: 48px;
      right: 180px; /* Safe from Like/Share column */
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.90);
      border: 1.5px solid {{CATEGORY_COLOR}};
      backdrop-filter: blur(16px);
      padding: 8px 20px;
      border-radius: 9999px;
      font-size: 19px;
      font-weight: 900;
      color: {{CATEGORY_COLOR}};
      width: fit-content;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .hook-headline {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.95), 0 2px 10px rgba(0, 0, 0, 0.8);
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 60%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Bottom 470px is 100% negative space reserved for YouTube Native Controls */
  </style>
</head>
<body>
  <!-- Full Bleed Photorealistic Visual -->
  <img class="bg-photo" src="{{SCENE_PHOTO_SRC}}" alt="Visual" />
  <div class="cinematic-vignette"></div>

  <!-- Floating Mobile Header (Y = 170px) -->
  <div class="floating-header broadcast-bar">
    <div class="brand-pill">
      <img class="brand-logo-img" src="{{BRAND_LOGO_DATA_URI}}" alt="VizhiTN" />
      <span class="brand-name">VizhiTN</span>
    </div>
    <div class="district-pill">📍 {{DISTRICT_NAME}}</div>
    <div class="live-alert-pill">
      <div class="live-dot"></div>
      அலர்ட்
    </div>
  </div>

  <!-- Upper-Third Hook Headline (Y = 275px) -->
  <div class="hook-container">
    <div class="category-badge">
      <span>{{CATEGORY_ICON}}</span>
      <span>{{CATEGORY_LABEL}}</span>
    </div>
    <h1 class="hook-headline">{{HOOK_HEADLINE_TA}}</h1>
  </div>
</body>
</html>
