<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Noto Sans Tamil';
      src: url('file:///{{FONTS_DIR}}/NotoSansTamil-Bold.ttf') format('truetype');
      font-weight: 700 900;
      font-style: normal;
      font-display: block;
    }
  </style>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #030712;
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      position: relative;
      color: #ffffff;
    }

    /* ── Full Bleed Photorealistic Visual Plate ─────────── */
    .bg-photo {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      object-fit: cover;
      filter: contrast(1.15) saturate(1.2) brightness(0.82);
    }
    .cinematic-vignette {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      background: radial-gradient(circle at 50% 40%, rgba(3, 7, 18, 0.2) 0%, rgba(3, 7, 18, 0.75) 60%, rgba(3, 7, 18, 0.96) 100%),
                  linear-gradient(180deg, rgba(3, 7, 18, 0.85) 0%, transparent 22%, transparent 65%, rgba(3, 7, 18, 0.98) 100%);
    }

    /* ── Sleek Modern Broadcast Top Bar ── */
    .broadcast-bar {
      position: absolute;
      top: 140px;
      left: 54px;
      right: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      padding: 10px 24px 10px 14px;
      border-radius: 9999px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .brand-logo-img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      border-radius: 10px;
      background: #ffffff;
      padding: 2px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .district-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .live-alert-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #dc2626;
      border: 1.5px solid #ef4444;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 19px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1.5px;
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.8);
    }
    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
    }

    /* ── High-Impact Headline Hero Box (No bloated cards) ── */
    .hero-container {
      position: absolute;
      top: 260px;
      left: 54px;
      right: 180px; /* Safe from Like/Share column */
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .category-strip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid {{CATEGORY_COLOR}};
      border-radius: 12px;
      padding: 8px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .category-icon { font-size: 24px; }
    .category-label {
      font-size: 20px;
      font-weight: 900;
      color: {{CATEGORY_COLOR}};
      letter-spacing: 0.5px;
    }

    .main-headline {
      font-size: 44px;
      font-weight: 900;
      line-height: 1.3;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.95), 0 2px 6px rgba(0, 0, 0, 0.9);
      letter-spacing: -0.3px;
    }

    /* Highlight badge for specific area/risk */
    .metadata-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      padding: 8px 18px;
      font-size: 18px;
      font-weight: 800;
      color: #f1f5f9;
    }
    .meta-tag.highlight {
      background: rgba(220, 38, 38, 0.25);
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* Safe lower zone strictly reserved for kinetic karaoke subtitles */
    .caption-zone-hint {
      position: absolute;
      bottom: 240px;
      left: 54px;
      right: 54px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- Background Visual -->
  <img class="bg-photo" src="{{SCENE_PHOTO_SRC}}" alt="Ground Reality Scene" />
  <div class="cinematic-vignette"></div>

  <!-- Top Broadcast Ticker -->
  <header class="broadcast-bar">
    <div class="brand-pill">
      <img class="brand-logo-img" src="{{BRAND_LOGO_DATA_URI}}" alt="VizhiTN" />
      <span class="brand-name">VizhiTN</span>
    </div>
    <div class="district-pill">📍 {{DISTRICT_NAME}}</div>
    <div class="live-alert-pill">
      <span class="live-dot"></span>
      <span>URGENT</span>
    </div>
  </header>

  <!-- Hero Content (Direct, readable, uncluttered) -->
  <main class="hero-container">
    <div class="category-strip">
      <span class="category-icon">{{CATEGORY_ICON}}</span>
      <span class="category-label">{{CATEGORY_LABEL}}</span>
    </div>

    <h1 class="main-headline">{{HOOK_HEADLINE_TA}}</h1>

    <div class="metadata-strip">
      <div class="meta-tag highlight">⚠️ உடனடி எச்சரிக்கை</div>
      <div class="meta-tag">📅 {{DATE_TEXT}}</div>
      <div class="meta-tag">🏛️ தமிழ்நாடு அரசு துறை</div>
    </div>
  </main>
</body>
</html>
