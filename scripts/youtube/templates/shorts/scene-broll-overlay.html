<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Noto Sans Tamil';
      src: url('file:///{{FONTS_DIR}}/NotoSansTamil-Bold.ttf') format('truetype');
      font-weight: 700 900;
      font-style: normal;
      font-display: block;
    }
  </style>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #030712;
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      position: relative;
      color: #ffffff;
    }

    /* ── Visual Plate ── */
    .bg-photo {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      object-fit: cover;
      filter: contrast(1.15) saturate(1.2) brightness(0.85);
    }
    .cinematic-vignette {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      background: radial-gradient(circle at 50% 40%, rgba(3, 7, 18, 0.25) 0%, rgba(3, 7, 18, 0.78) 60%, rgba(3, 7, 18, 0.96) 100%),
                  linear-gradient(180deg, rgba(3, 7, 18, 0.85) 0%, transparent 22%, transparent 65%, rgba(3, 7, 18, 0.98) 100%);
    }

    /* ── Sleek Broadcast Bar ── */
    .broadcast-bar {
      position: absolute;
      top: 140px;
      left: 54px;
      right: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      padding: 10px 24px 10px 14px;
      border-radius: 9999px;
    }
    .brand-logo-img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      border-radius: 10px;
      background: #ffffff;
      padding: 2px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
    }
    .location-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
    }

    /* ── Evidence & Affected Area Card ── */
    .evidence-stage {
      position: absolute;
      top: 260px;
      left: 54px;
      right: 180px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Exact Time Badge (Prominent & High-Contrast) */
    .time-hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      align-self: flex-start;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #030712;
      padding: 10px 24px;
      border-radius: 14px;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.5);
      letter-spacing: 0.5px;
    }

    .evidence-headline {
      font-size: 40px;
      font-weight: 900;
      line-height: 1.3;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
    }

    /* Affected streets/details box */
    .streets-box {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-left: 6px solid {{CATEGORY_COLOR}};
      border-radius: 18px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }
    .streets-title {
      font-size: 19px;
      font-weight: 900;
      color: {{CATEGORY_COLOR}};
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .streets-content {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.4;
      color: #f1f5f9;
    }
    .source-tag {
      font-size: 16px;
      font-weight: 800;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <img class="bg-photo" src="{{SCENE_PHOTO_SRC}}" alt="Evidence Plate" />
  <div class="cinematic-vignette"></div>

  <header class="broadcast-bar">
    <div class="brand-pill">
      <img class="brand-logo-img" src="{{BRAND_LOGO_DATA_URI}}" alt="VizhiTN" />
      <span class="brand-name">VizhiTN</span>
    </div>
    <div class="location-pill">📍 {{LOCATION_TEXT}}</div>
  </header>

  <main class="evidence-stage">
    <div class="time-hero-pill">
      <span>⏰</span>
      <span>நேரம்: {{TIMING_TEXT}}</span>
    </div>

    <h2 class="evidence-headline">{{HEADLINE_TA}}</h2>

    <div class="streets-box">
      <div class="streets-title">
        <span>{{CATEGORY_ICON}}</span>
        <span>பாதிக்கப்படும் பகுதிகள் / நிலவரம்</span>
      </div>
      <div class="streets-content">{{SUBHEADLINE_TA}}</div>
      <div class="source-tag">🏛️ {{SOURCE_ATTRIBUTION}}</div>
    </div>
  </main>
</body>
</html>
