<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@700;800;900&family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #071224;
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #ffffff;
      position: relative;
    }

    /* Background Photo / Frame Plate */
    .bg-photo {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      object-fit: cover;
    }

    /* Cinematic Gradient Layer */
    .cinematic-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      background: linear-gradient(
        180deg,
        rgba(7, 18, 36, 0.85) 0%,
        rgba(7, 18, 36, 0.25) 35%,
        rgba(7, 18, 36, 0.45) 60%,
        rgba(7, 18, 36, 0.95) 85%,
        #071224 100%
      );
    }

    /* Top Broadcast Bar */
    .broadcast-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 96px;
      background: rgba(7, 18, 36, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 44px;
      z-index: 30;
    }
    .brand-pill {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo-img {
      width: 54px; height: 54px;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
      padding: 3px;
    }
    .brand-name {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .ground-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #dc2626;
      color: #ffffff;
      padding: 8px 22px;
      border-radius: 9999px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1.5px;
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.6);
    }
    .live-dot {
      width: 10px; height: 10px;
      background: #ffffff;
      border-radius: 50%;
    }

    /* Floating Location Tag (Upper Middle) */
    .loc-tag-wrap {
      position: absolute;
      top: 140px;
      left: 44px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 9999px;
      z-index: 20;
    }
    .loc-icon { font-size: 22px; }
    .loc-text {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
    }

    /* Broadcast Lower Third (Bottom Panel) */
    .lower-third-panel {
      position: absolute;
      bottom: 60px;
      left: 44px;
      right: 44px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 32px;
      padding: 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      z-index: 20;
    }
    .lower-third-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 40px; right: 40px;
      height: 4px;
      background: {{CATEGORY_COLOR}};
      border-radius: 2px;
    }

    .category-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .category-badge {
      font-size: 18px;
      font-weight: 900;
      color: {{CATEGORY_COLOR}};
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .headline-ta {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.35;
      color: #ffffff;
      margin-bottom: 14px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .subheadline-ta {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      color: #cbd5e1;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .source-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .source-tag {
      font-size: 16px;
      font-weight: 800;
      color: #94a3b8;
    }
    .status-verified {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 900;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <!-- Full-Bleed Background Visual Plate -->
  <img src="{{SCENE_PHOTO_SRC}}" class="bg-photo" alt="Location Footage">
  <div class="cinematic-overlay"></div>

  <!-- Top Bar -->
  <header class="broadcast-bar">
    <div class="brand-pill">
      <img src="{{BRAND_LOGO_DATA_URI}}" class="brand-logo-img" alt="VizhiTN">
      <span class="brand-name">VIZHI TN</span>
    </div>
    <div class="ground-badge">
      <div class="live-dot"></div>
      FIELD REPORT
    </div>
  </header>

  <!-- Location Badge -->
  <div class="loc-tag-wrap">
    <span class="loc-icon">📍</span>
    <span class="loc-text">{{LOCATION_TEXT}}</span>
  </div>

  <!-- Lower Third Commentary -->
  <div class="lower-third-panel">
    <div class="category-row">
      <span>{{CATEGORY_ICON}}</span>
      <span class="category-badge">{{CATEGORY_LABEL}}</span>
    </div>
    <h1 class="headline-ta">{{HEADLINE_TA}}</h1>
    <p class="subheadline-ta">{{SUBHEADLINE_TA}}</p>
    <div class="source-strip">
      <span class="source-tag">{{SOURCE_ATTRIBUTION}}</span>
      <span class="status-verified">✓ கள ஆய்வு உறுதி செய்யப்பட்டது</span>
    </div>
  </div>
</body>
</html>
