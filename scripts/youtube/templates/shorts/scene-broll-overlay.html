<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@700;800;900&family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #020617;
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      position: relative;
      color: #ffffff;
    }

    /* ── Full Bleed Photorealistic Evidence Visual Plate ─────────── */
    .bg-photo {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      object-fit: cover;
      filter: contrast(1.18) saturate(1.22) brightness(0.9);
    }
    .cinematic-vignette {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 1920px;
      background: linear-gradient(
        180deg,
        rgba(2, 6, 23, 0.88) 0%,
        rgba(2, 6, 23, 0.3) 22%,
        rgba(2, 6, 23, 0.2) 60%,
        rgba(2, 6, 23, 0.8) 85%,
        rgba(2, 6, 23, 0.98) 100%
      );
    }

    /* ── Floating Header (Safely Below Mobile Top Bar at Y = 170px) ── */
    .floating-header, .broadcast-bar {
      position: absolute;
      top: 170px;
      left: 48px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 20;
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      padding: 8px 18px 8px 10px;
      border-radius: 9999px;
    }
    .brand-logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 10px;
      background: #ffffff;
      padding: 2px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .loc-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .ground-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #dc2626;
      border: 1.5px solid #ef4444;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 19px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.65);
    }
    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
    }

    /* ── Sleek Upper-Third Field Evidence Card (Y = 265px) ── */
    .evidence-card {
      position: absolute;
      top: 265px;
      left: 48px;
      right: 180px; /* Safe from Like/Share vertical column */
      z-index: 20;
      background: rgba(10, 15, 30, 0.94);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-left: 6px solid {{CATEGORY_COLOR}};
      border-radius: 24px;
      padding: 22px 28px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .evidence-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .category-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 19px;
      font-weight: 900;
      color: {{CATEGORY_COLOR}};
      letter-spacing: 0.5px;
    }
    .verified-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.18);
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .evidence-headline {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.35;
      color: #ffffff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }
    .dept-attribution {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }
    .dept-icon { font-size: 18px; }

    /* Bottom 470px is 100% negative space reserved for YouTube Native Controls */
  </style>
</head>
<body>
  <!-- Full Bleed Photorealistic Close-up Evidence Visual Plate -->
  <img class="bg-photo" src="{{SCENE_PHOTO_SRC}}" alt="Field Evidence" />
  <div class="cinematic-vignette"></div>

  <!-- Floating Mobile Header (Y = 170px) -->
  <div class="floating-header broadcast-bar">
    <div class="brand-pill">
      <img class="brand-logo-img" src="{{BRAND_LOGO_DATA_URI}}" alt="VizhiTN" />
      <span class="brand-name">VizhiTN</span>
    </div>
    <div class="loc-pill">📍 {{LOCATION_TEXT}}</div>
    <div class="ground-badge">
      <div class="live-dot"></div>
      கள அறிக்கை
    </div>
  </div>

  <!-- Sleek Upper-Third Evidence Card (Y = 265px) -->
  <div class="evidence-card">
    <div class="evidence-top">
      <div class="category-tag">
        <span>{{CATEGORY_ICON}}</span>
        <span>{{CATEGORY_LABEL}}</span>
      </div>
      <div class="verified-chip">
        <span>✓</span>
        <span>கள ஆய்வு உறுதி</span>
      </div>
    </div>
    <div class="evidence-headline">{{HEADLINE_TA}}</div>
    <div class="dept-attribution">
      <span class="dept-icon">🏛️</span>
      <span>{{SOURCE_ATTRIBUTION}}</span>
    </div>
  </div>
</body>
</html>
