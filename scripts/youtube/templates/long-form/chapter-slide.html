<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #071224;
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      position: relative;
      color: #ffffff;
    }

    /* ── Hero Editorial Photo (Right Panel) ──────────────── */
    .bg-image {
      position: absolute;
      right: 0; top: 0;
      width: 1020px; height: 1080px;
      object-fit: cover;
    }
    .gradient-overlay {
      position: absolute;
      left: 0; top: 0;
      width: 1920px; height: 1080px;
      background: linear-gradient(
        90deg,
        #071224 0%,
        #071224 44%,
        rgba(7,18,36,0.96) 56%,
        rgba(7,18,36,0.25) 78%,
        transparent 100%
      );
    }

    /* ── Global Top Bar (Broadcast Header) ───────────────── */
    .broadcast-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(7,18,36,0.95);
      border-bottom: 1.5px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      padding: 0 56px;
      gap: 20px;
      z-index: 30;
    }
    .brand-logo-pill {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo-img {
      width: 40px; height: 40px;
      object-fit: contain;
      border-radius: 9px;
      background: #fff;
      padding: 2px;
    }
    .brand-logo-text {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .divider {
      width: 1.5px;
      height: 28px;
      background: rgba(255,255,255,0.15);
      flex-shrink: 0;
    }
    .broadcast-label {
      font-size: 17px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 2px;
    }
    .chapter-tag {
      margin-left: auto;
      background: rgba(56,189,248,0.12);
      border: 1.5px solid #38bdf8;
      color: #38bdf8;
      font-size: 16px;
      font-weight: 900;
      padding: 6px 18px;
      border-radius: 9999px;
      letter-spacing: 1.5px;
    }

    /* ── Content Area (Left Panel) ───────────────────────── */
    .content {
      position: absolute;
      top: 64px; left: 0;
      width: 1080px; height: 1016px;
      padding: 40px 56px 80px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 20;
    }

    /* Category Badge */
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      background: rgba(30,58,138,0.5);
      border: 1px solid rgba(59,130,246,0.5);
      color: #93c5fd;
      padding: 6px 18px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* Headlines */
    .headline-ta {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 0 3px 12px rgba(0,0,0,0.5);
      margin-bottom: 10px;
    }
    .headline-en {
      font-size: 20px;
      font-weight: 700;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    /* Facts List */
    .facts-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .fact-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: rgba(15,23,42,0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-left: 3px solid #38bdf8;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      color: #e2e8f0;
      line-height: 1.4;
    }
    .fact-icon {
      color: #38bdf8;
      font-size: 22px;
      line-height: 1;
      margin-top: 2px;
      flex-shrink: 0;
    }

    /* Department Accountability Box */
    .dept-box {
      background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,41,59,0.95));
      border: 1px solid rgba(245,158,11,0.35);
      border-left: 6px solid #f59e0b;
      padding: 16px 22px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .dept-title {
      font-size: 18px;
      font-weight: 800;
      color: #fbbf24;
      line-height: 1.3;
    }
    .dept-contact {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }
    .dept-contact span {
      color: #38bdf8;
      font-weight: 900;
    }

    /* ── Bottom Anchor Bar (Full Width) ──────────────────── */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background: linear-gradient(90deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      border-top: 1.5px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 56px;
      z-index: 30;
    }
    .bottom-loc {
      color: #94a3b8;
      font-size: 18px;
      font-weight: 800;
    }
    .bottom-mid {
      display: flex;
      align-items: center;
      gap: 20px;
      color: #475569;
      font-size: 16px;
      font-weight: 700;
    }
    .bottom-mid::before,
    .bottom-mid::after {
      content: '•';
      color: #334155;
    }
    .bottom-site {
      color: #38bdf8;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    /* ── Progress Chapter Dots (Right Rail) ──────────────── */
    .chapter-dots {
      position: absolute;
      right: 32px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 25;
    }
    .ch-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
    }
    .ch-dot.active {
      background: #38bdf8;
      box-shadow: 0 0 8px rgba(56,189,248,0.8);
    }
  </style>
</head>
<body>
  <!-- Hero Photo + Gradient -->
  <img class="bg-image" src="{{HERO_IMAGE_SRC}}" alt="Editorial Visual" />
  <div class="gradient-overlay"></div>

  <!-- Broadcast Top Bar -->
  <div class="broadcast-top">
    <div class="brand-logo-pill">
      <img class="brand-logo-img" src="{{BRAND_LOGO_DATA_URI}}" alt="VizhiTN" />
      <span class="brand-logo-text">VizhiTN | Tamil Nadu In-Depth</span>
    </div>
    <div class="divider"></div>
    <span class="broadcast-label">GROUND REALITY SERIES</span>
    <div class="chapter-tag">CHAPTER {{CHAPTER_NUM}}</div>
  </div>

  <!-- Content Panel -->
  <div class="content">
    <div>
      <div class="category-badge">{{CATEGORY_NAME}}</div>
      <h1 class="headline-ta">{{HEADLINE_TA}}</h1>
      <p class="headline-en">{{HEADLINE_EN}}</p>

      <div class="facts-list">
        {{FACTS_HTML}}
      </div>
    </div>

    <div class="dept-box">
      <div class="dept-title">🏛️ {{DEPT_NAME}}</div>
      <div class="dept-contact">📞 <span>{{HELPLINE_NUM}}</span></div>
    </div>
  </div>

  <!-- Chapter Progress Dots -->
  <div class="chapter-dots">
    <div class="ch-dot {{DOT_1_CLASS}}"></div>
    <div class="ch-dot {{DOT_2_CLASS}}"></div>
    <div class="ch-dot {{DOT_3_CLASS}}"></div>
    <div class="ch-dot {{DOT_4_CLASS}}"></div>
    <div class="ch-dot {{DOT_5_CLASS}}"></div>
  </div>

  <!-- Bottom Anchor Bar -->
  <div class="bottom-bar">
    <div class="bottom-loc">📍 {{LOCATION_TEXT}}</div>
    <div class="bottom-mid">Tamil Nadu Civic Journalism</div>
    <div class="bottom-site">🌐 vizhitn.in</div>
  </div>
</body>
</html>
