<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #071224;
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      position: relative;
      color: #ffffff;
    }

    /* Hero Editorial Photo (Right Half) */
    .bg-image {
      position: absolute;
      right: 0;
      top: 0;
      width: 1050px;
      height: 1080px;
      object-fit: cover;
    }
    .gradient-overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      background: linear-gradient(90deg, #071224 0%, #071224 45%, rgba(7, 18, 36, 0.94) 58%, rgba(7, 18, 36, 0.3) 80%, transparent 100%);
    }

    /* Content Area (Left Half) */
    .content {
      position: relative;
      z-index: 10;
      width: 1120px;
      height: 1080px;
      padding: 70px 80px 100px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }
    .brand-logo-pill {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 22px 8px 12px;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }
    .brand-logo-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 10px;
      background: #ffffff;
      padding: 2px;
    }
    .brand-logo-text {
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .chapter-tag {
      background: rgba(56, 189, 248, 0.15);
      border: 2px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 22px;
      border-radius: 9999px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-left: auto;
    }

    .category-badge {
      display: inline-block;
      align-self: flex-start;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      color: #93c5fd;
      padding: 6px 20px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .headline-ta {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.3;
      color: #ffffff;
      margin-bottom: 16px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .headline-en {
      font-size: 24px;
      font-weight: 700;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 32px;
    }

    /* Key Facts & Analysis Cards */
    .facts-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .fact-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 22px;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.4;
    }
    .fact-icon {
      color: #38bdf8;
      font-size: 26px;
      line-height: 1;
      margin-top: 2px;
    }

    /* Department / Helpline Accountability Banner */
    .dept-box {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 8px solid #f59e0b;
      padding: 18px 24px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dept-title {
      font-size: 19px;
      font-weight: 800;
      color: #fbbf24;
    }
    .dept-contact {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
    }
    .dept-contact span {
      color: #38bdf8;
      font-weight: 900;
    }

    /* Bottom Anchor Bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1920px;
      height: 70px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 80px;
      z-index: 20;
      border-top: 2px solid rgba(255, 255, 255, 0.1);
    }
    .bottom-loc {
      color: #cbd5e1;
      font-size: 22px;
      font-weight: 800;
    }
    .bottom-site {
      color: #38bdf8;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <img class="bg-image" src="{{HERO_IMAGE_SRC}}" alt="Editorial Visual" />
  <div class="gradient-overlay"></div>

  <div class="content">
    <div>
      <div class="top-meta">
        <div class="brand-logo-pill">
          <img class="brand-logo-img" src="{{BRAND_LOGO_DATA_URI}}" alt="VizhiTN" />
          <span class="brand-logo-text">VizhiTN | Tamil Nadu In-Depth</span>
        </div>
        <div class="chapter-tag">CHAPTER {{CHAPTER_NUM}}</div>
      </div>

      <div class="category-badge">{{CATEGORY_NAME}}</div>
      <h1 class="headline-ta">{{HEADLINE_TA}}</h1>
      <p class="headline-en">{{HEADLINE_EN}}</p>

      <div class="facts-list">
        {{FACTS_HTML}}
      </div>
    </div>

    <div class="dept-box">
      <div class="dept-title">🏛️ பொறுப்புத் துறை / Department: {{DEPT_NAME}}</div>
      <div class="dept-contact">உதவி எண்: <span>{{HELPLINE_NUM}}</span></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-loc">📍 {{LOCATION_TEXT}}</div>
    <div class="bottom-site">🌐 vizhitn.in | Subscribe for Weekly In-Depth Reports</div>
  </div>
</body>
</html>
