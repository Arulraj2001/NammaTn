<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: radial-gradient(circle at 85% 15%, #1e1b4b 0%, #09090b 70%);
      font-family: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 80px;
      color: #fff;
    }
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .badge-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .live-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(239, 68, 68, 0.2);
      border: 1.5px solid #ef4444;
      padding: 10px 24px;
      border-radius: 9999px;
      font-weight: 900;
      font-size: 20px;
      color: #fca5a5;
    }
    .live-dot {
      width: 14px;
      height: 14px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 16px #ef4444;
    }
    .category-badge {
      background: rgba(30, 41, 59, 0.85);
      border: 1.5px solid #475569;
      color: #38bdf8;
      padding: 10px 24px;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 22px;
    }
    .segment-counter {
      background: #3b82f6;
      color: #fff;
      font-weight: 900;
      font-size: 22px;
      padding: 10px 24px;
      border-radius: 9999px;
    }
    .date-badge {
      background: #eab308;
      color: #000;
      font-weight: 900;
      font-size: 24px;
      padding: 10px 28px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(234, 179, 8, 0.4);
    }
    .main-body {
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 1760px;
    }
    .headline {
      font-size: 58px;
      font-weight: 900;
      color: #fef08a;
      line-height: 1.2;
      text-shadow: 0 4px 24px rgba(0,0,0,0.9);
      border-left: 8px solid #eab308;
      padding-left: 24px;
    }
    .facts-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 28px 36px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .facts-text {
      font-size: 32px;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.5;
    }
    .exam-pointer-card {
      background: linear-gradient(90deg, rgba(30, 27, 75, 0.95), rgba(15, 23, 42, 0.9));
      border: 2px solid #6366f1;
      border-radius: 16px;
      padding: 24px 36px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
    }
    .pointer-header {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #a5b4fc;
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .pointer-text {
      font-size: 30px;
      font-weight: 800;
      color: #e0e7ff;
      line-height: 1.4;
    }
    .bottom-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 18px 32px;
    }
    .recall-box {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 24px;
      font-weight: 800;
      color: #fde047;
    }
    .source-tag {
      font-size: 20px;
      font-weight: 700;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="grid-pattern"></div>
  
  <div class="top-header">
    <div class="badge-group">
      <div class="live-pill">
        <div class="live-dot"></div>
        <span>TN 24H EXPRESS</span>
      </div>
      <div class="category-badge">{{CATEGORY_LABEL}}</div>
      <div class="segment-counter">செய்தி {{SEGMENT_INDEX}} / {{TOTAL_SEGMENTS}}</div>
    </div>
    <div class="date-badge">📅 {{TAMIL_DATE}}</div>
  </div>

  <div class="main-body">
    <h1 class="headline">{{HEADLINE_TA}}</h1>
    
    <div class="facts-card">
      <p class="facts-text">{{CORE_FACTS_TA}}</p>
    </div>

    <div class="exam-pointer-card">
      <div class="pointer-header">
        <span>⭐ தேர்வு குறிப்பு (TNPSC STUDY POINTER)</span>
      </div>
      <p class="pointer-text">{{EXAM_POINTER_TA}}</p>
    </div>
  </div>

  <div class="bottom-footer">
    <div class="recall-box">
      <span>❓ நினைவுகூர்க:</span>
      <span>{{RECALL_QUESTION_TA}}</span>
    </div>
    <div class="source-tag">ஆதாரம்: {{SOURCE_NAME}}</div>
  </div>
</body>
</html>
